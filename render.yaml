# Render Infrastructure Blueprint for TeleAgent SaaS Production Deployment
services:
  # 1. TeleAgent Backend API & Telegram Orchestration Engine
  - type: web
    name: teleagent-backend
    runtime: node
    plan: starter
    region: oregon
    buildCommand: cd server && npm install && npm run build && npm run db:migrate
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # 2. TeleAgent React Frontend SPA (Static Site)
  - type: web
    name: teleagent-frontend
    runtime: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
